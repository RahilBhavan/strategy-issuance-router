<svg xmlns="http://www.w3.org/2000/svg" width="400" height="985" viewBox="0 0 400 985" role="img" aria-labelledby="title desc">
<title id="title">Synthetic $25M allocation versus $22M actual issuance</title>
<desc id="desc">Net USD millions and cost per net dollar raised. MSTR cost 0.84, scenario 24.88, actual 22.00; STRC cost 1.21, scenario 0.00, actual 0.00; STRD cost 1.01, scenario 0.00, actual 0.00; STRF cost 1.01, scenario 0.00, actual 0.00; STRK cost 0.89, scenario 0.13, actual 0.00. The $25M target is illustrative, not a filed or planned raise. Actual October 12–18, 2026. Scenario replay, not a backtest.</desc>
