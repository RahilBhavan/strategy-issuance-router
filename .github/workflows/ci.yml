name: Offline verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.0'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q router scripts tests
      - run: python -m router --scenario examples/synthetic.json > replay.json
      - run: diff -u examples/result.json replay.json
      - run: python scripts/render_result.py --check
